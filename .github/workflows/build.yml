name: Testes e .exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # para publicar a Release quando houver uma tag v*

jobs:
  windows:
    name: Windows ${{ matrix.bits }} bits
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            bits: 64
          - arch: x86
            bits: 32

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes
        run: python -m pytest -q

      - name: Gerar o .exe
        run: pyinstaller omac.spec --noconfirm

      - name: Autoteste do .exe com notas de exemplo
        shell: pwsh
        run: |
          python -m tests.fabrica exemplo
          $p = Start-Process -FilePath dist\OMAC.exe -ArgumentList '--autoteste', 'exemplo', 'relatorio.json' -Wait -PassThru
          Get-Content relatorio.json
          python -c "import json,sys; r=json.load(open('relatorio.json',encoding='utf-8')); sys.exit('erro' in r or r['notas']!=12 or len(r['canceladas_movidas'])!=1)"
          if ($LASTEXITCODE -ne 0 -or $p.ExitCode -ne 0) { exit 1 }
          if (-not (Test-Path 'Notas fiscais - Outubro 2026.xlsx')) { exit 1 }

      - name: Renomear
        shell: pwsh
        run: Move-Item dist\OMAC.exe "dist\OMAC-${{ matrix.bits }}bits.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: OMAC-${{ matrix.bits }}bits
          path: dist/OMAC-${{ matrix.bits }}bits.exe

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
